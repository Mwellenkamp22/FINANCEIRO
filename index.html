<!doctype html>
<html lang="pt-BR" data-tema="binance">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaTema" content="#0B0E11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Meu Financeiro</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --txt:#1b1f24; --mut:#5f6b7a; --line:#e3e7ec; --pos:#15803d; --neg:#b91c1c; --acc:#1d4ed8; --posbg:#e7f6ec; --negbg:#fdeaea; --warn:#b45309; --onacc:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --card:#171b21; --txt:#e8ecf1; --mut:#9aa6b4; --line:#2a313a; --pos:#4ade80; --neg:#f87171; --acc:#7aa2ff; --posbg:#12301f; --negbg:#3a1717; --warn:#fbbf24; } }
  :root[data-tema="binance"] { --bg:#0B0E11; --card:#181A20; --txt:#EAECEF; --mut:#848E9C; --line:#2B3139; --pos:#0ECB81; --neg:#F6465D; --posbg:#10291f; --negbg:#33161c; --warn:#F0B90B; --acc:#1D4ED8; --onacc:#fff; --acct:#6C9BFF; }
  :root[data-tema="binance"] .card, :root[data-tema="binance"] .kpi { border-color:transparent; }
  :root[data-tema="binance"] .btn { border-radius:8px; border-color:var(--line); background:#2B3139; }
  :root[data-tema="binance"] .btn.pri, :root[data-tema="binance"] .btn[aria-pressed="true"] { background:var(--acc); color:var(--onacc); border-color:var(--acc); font-weight:600; }
  :root[data-tema="binance"] .kpi.big .v { font-size:30px; letter-spacing:-.5px; }
  :root[data-tema="binance"] nav { border-top-color:var(--line); }
  :root[data-tema="binance"] .f input, :root[data-tema="binance"] .f select, :root[data-tema="binance"] .irow input[type=text], :root[data-tema="binance"] .irow select { background:#2B3139; border-color:#2B3139; }
  :root[data-tema="binance"] .bar { background:#2B3139; }
  :root[data-tema="binance"] .tag { background:#2B3139; }
  :root[data-tema="claro"] { --bg:#f6f7f9; --card:#fff; --txt:#1b1f24; --mut:#5f6b7a; --line:#e3e7ec; --pos:#15803d; --neg:#b91c1c; --posbg:#e7f6ec; --negbg:#fdeaea; --warn:#b45309; }
  :root[data-tema="escuro"] { --bg:#0f1216; --card:#171b21; --txt:#e8ecf1; --mut:#9aa6b4; --line:#2a313a; --pos:#4ade80; --neg:#f87171; --posbg:#12301f; --negbg:#3a1717; --warn:#fbbf24; }
  :root[data-tema="preto"] { --bg:#000; --card:#0c0c0e; --txt:#f2f2f2; --mut:#9a9aa2; --line:#26262b; --pos:#4ade80; --neg:#f87171; --posbg:#0f2a1a; --negbg:#341414; --warn:#fbbf24; }
  :root[data-tema="noite"] { --bg:#0b1220; --card:#121c30; --txt:#e6edf7; --mut:#94a3bd; --line:#24324d; --pos:#4ade80; --neg:#fb7185; --posbg:#10301f; --negbg:#3a1a24; --warn:#fbbf24; }
  :root[data-tema="verde"] { --bg:#eef5ef; --card:#fbfefb; --txt:#16241a; --mut:#587060; --line:#d4e3d7; --pos:#15803d; --neg:#b91c1c; --posbg:#dcf1e2; --negbg:#fbe4e4; --warn:#b45309; }
  :root[data-tema="sepia"] { --bg:#f4ecd8; --card:#fbf6e8; --txt:#3b2f1e; --mut:#7a6a50; --line:#e2d6b8; --pos:#2f7a3a; --neg:#a8302a; --posbg:#e3eed2; --negbg:#f6dcd2; --warn:#a15c07; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 system-ui,"Segoe UI",sans-serif; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 8px; display:flex; align-items:center; gap:8px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:14px; margin:0 0 8px; color:var(--mut); font-weight:600; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .kpi .l { color:var(--mut); font-size:12px; } .kpi .v { font-size:19px; font-weight:650; font-variant-numeric:tabular-nums; }
  .kpi.big { grid-column:1/-1; } .kpi.big .v { font-size:26px; }
  .pos { color:var(--pos); } .neg { color:var(--neg); } .mut { color:var(--mut); } .warn { color:var(--warn); }
  .mes { display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 12px; font-weight:600; } .mes span::first-letter { text-transform:uppercase; }
  button, select, input, textarea { font:inherit; color:var(--txt); }
  .btn { border:1px solid var(--line); background:var(--card); padding:7px 14px; border-radius:999px; cursor:pointer; }
  .btn.pri { background:var(--acc); color:var(--onacc); border-color:var(--acc); } .btn.perigo { color:var(--neg); }
  .btn.ic { padding:6px 11px; }
  nav { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:6; }
  nav button { flex:1; border:0; background:none; padding:9px 2px 8px; font-size:11.5px; color:var(--mut); cursor:pointer; }
  nav button svg { width:22px; height:22px; display:block; margin:0 auto 2px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  nav button[aria-current="true"] { color:var(--acct, var(--acc)); font-weight:650; }
  .fab { position:fixed; right:16px; bottom:calc(76px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; border:0; background:var(--acc); color:var(--onacc); font-size:28px; box-shadow:0 4px 14px rgba(0,0,0,.3); cursor:pointer; z-index:7; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); } .item:last-child { border-bottom:0; }
  .item .m { flex:1; min-width:0; } .item .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .item .s { color:var(--mut); font-size:12.5px; }
  .item .val { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:4px; } .bar i { display:block; height:100%; background:var(--acc); }
  .cat { margin-bottom:10px; } .cat .h { display:flex; justify-content:space-between; font-size:13.5px; }
  .tag { white-space:nowrap; font-size:11px; padding:1px 7px; border-radius:999px; background:var(--line); color:var(--mut); }
  .tag.venc { background:var(--negbg); color:var(--neg); } .tag.prox { background:var(--line); color:var(--warn); } .tag.ok { background:var(--posbg); color:var(--pos); }
  dialog { border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--txt); width:min(440px,calc(100vw - 24px)); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h3 { margin:0 0 10px; font-size:17px; }
  .f { display:grid; gap:4px; margin-bottom:10px; } .f label { font-size:12.5px; color:var(--mut); }
  .f input, .f select { padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); width:100%; }
  .seg { display:flex; gap:6px; } .seg button { flex:1; } .seg .btn[aria-pressed="true"] { background:var(--acc); color:var(--onacc); border-color:var(--acc); }
  .acoes { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .vazio { text-align:center; color:var(--mut); padding:18px 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .note { color:var(--mut); font-size:12.5px; }
  dialog.larga { width:min(720px,calc(100vw - 16px)); max-height:92vh; overflow:auto; padding:12px; }
  .irow { border-bottom:1px solid var(--line); padding:8px 0; display:grid; gap:6px; } .irow.off { opacity:.5; }
  .irow .l1 { display:flex; align-items:center; gap:8px; font-size:13px; } .irow .l1 b { margin-left:auto; font-variant-numeric:tabular-nums; }
  .irow .l3 { display:flex; gap:6px; } .irow input[type=text], .irow select { padding:7px 8px; border:1px solid var(--line); border-radius:9px; background:var(--bg); min-width:0; width:100%; }
  .irow input[type=checkbox] { width:20px; height:20px; }
  .rod { position:sticky; bottom:-12px; background:var(--card); padding:10px 0 4px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header><h1 id="titulo">Meu Financeiro</h1><button class="btn ic" id="btnOculta" title="Ocultar ou mostrar valores">🙈</button></header>
<div class="wrap" id="view"></div>
<button class="fab" id="fab" aria-label="Adicionar">+</button>
<nav id="nav">
  <button data-v="resumo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
  <button data-v="lanc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançamentos</button>
  <button data-v="contas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Contas</button>
  <button data-v="inv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l2-3h14l2 3"/><path d="M16 13h2"/></svg>Carteira</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Ajustes</button>
</nav>

<dialog id="dlg"></dialog>

<script>
(function () {
  'use strict';
  const KEY = 'meu_financeiro_v1';
  const CATS = { d: ['Moradia', 'Alimentação', 'Transporte', 'Saúde', 'Lazer', 'Educação', 'Contas', 'Compras', 'Outros'], r: ['Salário', 'Extra', 'Rendimentos', 'Outros'] };
  const vazio = () => ({ v: 1, lanc: [], contas: [], cats: JSON.parse(JSON.stringify(CATS)), orc: {}, regras: {}, inv: null, pref: { oculta: false, tema: 'binance', acc: '' } });
  let S = vazio(), memoria = false;

  // ---------- armazenamento (so neste aparelho) ----------
  function carrega() {
    try { const t = localStorage.getItem(KEY); if (t) S = Object.assign(vazio(), JSON.parse(t)); }
    catch (e) { memoria = true; }
    S.pref = Object.assign({ oculta: false, tema: 'binance', acc: '' }, S.pref || {});
  }
  function salva() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memoria = true; } }

  // ---------- utilitarios ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MASC = 'R$ ••••';
  const brl = n => S.pref.oculta ? MASC : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hoje = () => iso(new Date());
  const mesDe = s => s.slice(0, 7);
  const dmy = s => s.split('-').reverse().join('/');
  const nomeMes = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const somaMes = (m, k) => { const [a, b] = m.split('-').map(Number); const d = new Date(a, b - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const diasEntre = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
  function parseValor(t) {
    t = String(t || '').trim().replace(/[R$\s]/g, '');
    if (!t) return NaN;
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
    return parseFloat(t);
  }
  function proxMes(dataIso, k = 1) {   // mesmo dia no mes seguinte (ajusta fim de mes)
    const [a, m, d] = dataIso.split('-').map(Number);
    const alvo = new Date(a, m - 1 + k, 1), ult = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
    return `${alvo.getFullYear()}-${pad(alvo.getMonth() + 1)}-${pad(Math.min(d, ult))}`;
  }

  // ---------- aparencia ----------
  function aplicaVisual() {
    const r = document.documentElement, p = S.pref;
    if (p.tema && p.tema !== 'auto') r.setAttribute('data-tema', p.tema); else r.removeAttribute('data-tema');
    if (p.acc) { r.style.setProperty('--acc', p.acc); r.style.setProperty('--acct', p.acc); } else { r.style.removeProperty('--acc'); r.style.removeProperty('--acct'); }
    if (p.acc) { const n = parseInt(p.acc.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; r.style.setProperty('--onacc', lum > 0.6 ? '#181A20' : '#fff'); } else r.style.removeProperty('--onacc');
    const mt = $('metaTema'); if (mt) mt.setAttribute('content', getComputedStyle(document.body).backgroundColor ? '#' + [...getComputedStyle(document.body).backgroundColor.match(/\d+/g).slice(0, 3)].map(v => (+v).toString(16).padStart(2, '0')).join('') : '#0B0E11');
    $('btnOculta').textContent = p.oculta ? '👁' : '🙈';
  }

  // ---------- estado de tela ----------
  let tela = 'resumo', mes = mesDe(hoje()), filtroTipo = 'todos', evoN = 6, aviso = '';
  const mesCurto = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');

  // evolucao: receitas x despesas dos ultimos N meses ate o mes escolhido
  function evolucao() {
    const ms = Array.from({ length: evoN }, (_, i) => somaMes(mes, i - evoN + 1));
    const d = ms.map(m => { const l = doMes(m); return { m, r: total(l, 'r'), d: total(l, 'd') }; });
    const max = Math.max(1, ...d.map(x => Math.max(x.r, x.d)));
    const W = 320, H = 150, base = 128, gw = W / d.length, bw = Math.min(16, gw / 2 - 3);
    const alt = v => Math.max(v > 0 ? 2 : 0, v / max * (base - 12));
    const barras = d.map((x, i) => {
      const cx = gw * i + gw / 2;
      return `<g><title>${esc(nomeMes(x.m))}: receitas ${brl(x.r)}, despesas ${brl(x.d)}, saldo ${brl(x.r - x.d)}</title>
        <rect x="${cx - bw - 1}" y="${base - alt(x.r)}" width="${bw}" height="${alt(x.r)}" rx="2" fill="var(--pos)"/>
        <rect x="${cx + 1}" y="${base - alt(x.d)}" width="${bw}" height="${alt(x.d)}" rx="2" fill="var(--neg)"/>
        <text x="${cx}" y="${base + 15}" text-anchor="middle" font-size="10.5" fill="var(--mut)">${esc(mesCurto(x.m))}</text></g>`;
    }).join('');
    const saldoTot = d.reduce((s, x) => s + x.r - x.d, 0);
    return `<div class="card"><h2>Evolução mês a mês</h2>
      <div class="row">${[6, 12].map(n => `<button class="btn" data-evo="${n}" style="${evoN === n ? 'background:var(--acc);color:var(--onacc);border-color:var(--acc)' : ''}">${n} meses</button>`).join('')}
        <span class="note"><span style="color:var(--pos)">■</span> receitas &nbsp;<span style="color:var(--neg)">■</span> despesas</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas e despesas por mês"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>${barras}</svg>
      <table style="width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px">
        <tr class="mut"><th style="text-align:left">Mês</th><th style="text-align:right">Receitas</th><th style="text-align:right">Despesas</th><th style="text-align:right">Saldo</th></tr>
        ${d.slice().reverse().map(x => `<tr><td>${esc(mesCurto(x.m))}/${x.m.slice(2, 4)}</td><td style="text-align:right">${brl(x.r)}</td><td style="text-align:right">${brl(x.d)}</td><td style="text-align:right" class="${x.r - x.d >= 0 ? 'pos' : 'neg'}">${brl(x.r - x.d)}</td></tr>`).join('')}
        <tr style="border-top:1px solid var(--line);font-weight:650"><td>Total</td><td></td><td></td><td style="text-align:right" class="${saldoTot >= 0 ? 'pos' : 'neg'}">${brl(saldoTot)}</td></tr>
      </table></div>`;
  }

  // ---------- consultas ----------
  const doMes = m => S.lanc.filter(l => mesDe(l.data) === m);
  const total = (lst, t) => lst.filter(l => l.tipo === t).reduce((s, l) => s + l.valor, 0);
  const situacao = c => {
    if (c.pago) return { cl: 'ok', tx: 'paga' };
    const d = diasEntre(hoje(), c.venc);
    if (d < 0) return { cl: 'venc', tx: `venceu há ${-d} dia${d === -1 ? '' : 's'}`, ordem: 0 };
    if (d === 0) return { cl: 'venc', tx: 'vence hoje', ordem: 1 };
    if (d <= 7) return { cl: 'prox', tx: `vence em ${d} dia${d === 1 ? '' : 's'}`, ordem: 2 };
    return { cl: '', tx: dmy(c.venc), ordem: 3 };
  };

  // ---------- telas ----------
  function resumo() {
    const l = doMes(mes), rec = total(l, 'r'), des = total(l, 'd'), sal = rec - des;
    const porCat = {};
    l.filter(x => x.tipo === 'd').forEach(x => porCat[x.cat] = (porCat[x.cat] || 0) + x.valor);
    const orc = S.orc || {};
    const nomes = [...new Set([...Object.keys(porCat), ...Object.keys(orc).filter(k => orc[k] > 0)])];
    const linhas = nomes.map(c => ({ c, g: porCat[c] || 0, l: orc[c] > 0 ? orc[c] : 0 })).sort((a, b) => (b.l ? b.g / b.l : 0) - (a.l ? a.g / a.l : 0) || b.g - a.g);
    const estouro = linhas.filter(x => x.l && x.g > x.l), perto = linhas.filter(x => x.l && x.g <= x.l && x.g >= 0.8 * x.l);
    const maxG = Math.max(1, ...linhas.map(x => Math.max(x.g, x.l)));
    const abertas = S.contas.filter(c => !c.pago).sort((a, b) => a.venc.localeCompare(b.venc));
    const alerta = abertas.filter(c => diasEntre(hoje(), c.venc) <= 7);
    const aPagar = abertas.filter(c => mesDe(c.venc) === mes).reduce((s, c) => s + c.valor, 0);
    const avisoHtml = aviso ? `<div class="card" style="border-color:var(--neg)"><b class="neg">${esc(aviso)}</b></div>` : '';
    aviso = '';
    const limites = (estouro.length || perto.length) ? `<div class="card" style="border-color:${estouro.length ? 'var(--neg)' : 'var(--warn)'}"><h2>Orçamento do mês</h2>
      ${estouro.map(x => `<div class="neg">⚠ ${esc(x.c)} estourou o limite em ${brl(x.g - x.l)}</div>`).join('')}
      ${perto.map(x => `<div class="warn">● ${esc(x.c)} já usou ${(x.g / x.l * 100).toFixed(0)}% do limite (restam ${brl(x.l - x.g)})</div>`).join('')}</div>` : '';
    return `${avisoHtml}${seletorMes()}
    ${limites}
    <div class="kpis">
      <div class="kpi big"><div class="l">Saldo do mês</div><div class="v ${sal >= 0 ? 'pos' : 'neg'}">${brl(sal)}</div></div>
      <div class="kpi"><div class="l">Receitas</div><div class="v pos">${brl(rec)}</div></div>
      <div class="kpi"><div class="l">Despesas</div><div class="v neg">${brl(des)}</div></div>
      <div class="kpi"><div class="l">Contas a pagar no mês</div><div class="v">${brl(aPagar)}</div></div>
      <div class="kpi"><div class="l">Carteira de investimentos</div><div class="v">${invAtivos().length ? brl(invTotal()) : '—'}</div></div>
    </div>
    ${alerta.length ? `<div class="card"><h2>Atenção: contas vencidas ou perto de vencer</h2>${alerta.map(linhaConta).join('')}</div>` : ''}
    <div class="card"><h2>Despesas por categoria${Object.values(orc).some(v => v > 0) ? ' e limites' : ''}</h2>${linhas.length ? linhas.map(x => {
      const cor = x.l && x.g > x.l ? 'var(--neg)' : x.l && x.g >= 0.8 * x.l ? 'var(--warn)' : 'var(--acc)';
      const texto = x.l ? `${brl(x.g)} de ${brl(x.l)}` : `${brl(x.g)} <span class="mut">(${des ? (x.g / des * 100).toFixed(0) : 0}%)</span>`;
      const larg = x.l ? Math.min(100, x.g / x.l * 100) : x.g / maxG * 100;

  function mesclaInv(o) {   // importa o resumo do computador: atualiza o valor dos ativos de mesmo nome e instituicao, mantem o que voce digitou

  function formConta(ed) {

  function alternaPaga(cid) {

  // ---------- arquivos ----------
  function lerArquivo(cb) {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { alert('Arquivo inválido.'); } }; r.readAsText(f); };
    i.click();

  function baixa(nome, obj) {

    a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- importar extrato (CSV / OFX), tudo no aparelho ----------
  const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const PREFIXO = /^\s*(compra (no )?(debito|credito)|(pix|ted|doc|transferencia)( recebid[oa]| enviad[oa])?( pelo pix)?( para| de)?|pagamento( de)?( boleto)?|debito|credito)\s*[-:]*\s*/;
  const chaveDesc = s => semAcento(s).replace(PREFIXO, '').replace(/[0-9]+/g, ' ').replace(/[^a-z ]+/g, ' ').split(/\s+/).filter(w => w.length > 1).slice(0, 3).join(' ');
  const PADROES = [
    ['Alimentação', /ifood|rappi|restaurante|lanchonete|padaria|mercado|supermercado|atacad|acougue|hortifruti|pizz|burger|cafe|sorvet|assai|carrefour/],
    ['Transporte', /uber|99 ?pop|99app|posto|combust|gasolina|onibus|bilhete|metro|estaciona|pedagio|sem parar|shell|ipiranga/],
    ['Saúde', /farmac|drogar|droga |raia|pacheco|hospital|clinica|laborat|consulta|dentist|plano de saude|unimed/],
    ['Lazer', /netflix|spotify|disney|hbo|prime video|youtube|cinema|ingresso|steam|playstation|xbox|bar |show /],
    ['Educação', /curso|faculdade|escola|udemy|alura|livraria|mensalidade esc/],
    ['Moradia', /aluguel|condominio|energia|enel|cemig|copasa|sabesp|agua|luz |gas |iptu|internet|vivo|claro|tim |oi fibra/],
    ['Compras', /amazon|mercado ?livre|shopee|magalu|magazine|americanas|shein|renner|c&a|zara|aliexpress/]
  ];
  const IGNORAR = /aplicacao|resgate|rdb|caixinha|guardad|investiment|transferencia entre|pagamento de fatura|fatura|cdb|tesouro/;
  function sugere(desc, tipo) {
    const k = chaveDesc(desc), d = semAcento(desc);
    const lista = S.cats[tipo] || [];
    const ok = c => lista.includes(c) ? c : (lista.includes('Outros') ? 'Outros' : lista[0]);
    if (k && S.regras && S.regras[k]) return ok(S.regras[k]);
    if (tipo === 'r') {
      if (/salario|folha|pagamento de salario/.test(d)) return ok('Salário');
      if (/rendimento|juros|dividend|jcp|proventos/.test(d)) return ok('Rendimentos');
      return ok('Outros');
    }
    for (const [c, re] of PADROES) if (re.test(d)) return ok(c);
    return ok('Outros');
  }
  function lerTexto(buf) {
    let t = new TextDecoder('utf-8').decode(buf);
    if (t.includes('�')) t = new TextDecoder('windows-1252').decode(buf);

  }
  function parseCSV(t) {
    const prim = t.split(/\r?\n/).find(l => l.trim()) || '';

    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (asp) { if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else asp = false; } else campo += c; }
      else if (c === '"') asp = true;
      else if (c === sep) { cur.push(campo); campo = ''; }

  function parseData(s) {

    m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return null;
  }
  function extrairCSV(t) {
    const rows = parseCSV(t); if (rows.length < 2) throw new Error('vazio');
    const cab = rows[0].map(semAcento);
    const tem = re => cab.findIndex(h => re.test(h));
    const iData = tem(/^(data|date|dt)/), iVal = tem(/^(valor|amount|value|quantia)/), iDesc = tem(/descri|title|hist|memo|lancamento|estabelec|nome/);

      if (!v || isNaN(v)) return;

      out.push({ data, valor: Math.abs(v), tipo: v < 0 ? 'd' : 'r', desc: (r[iDesc >= 0 ? iDesc : 1] || '').trim(), ext: iId >= 0 ? (r[iId] || '').trim() : '' });
    });

  }
  function extrairOFX(t) {
    const out = [], re = /<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|<\/CCSTMTTRNRS>)/gi;
    let m;

      const tag = n => { const x = m[1].match(new RegExp('<' + n + '>([^<\\r\\n]*)', 'i')); return x ? x[1].trim() : ''; };
      const data = parseData(tag('DTPOSTED')); let a = tag('TRNAMT'); if (!a.includes('.')) a = a.replace(',', '.');
      const v = parseFloat(a); if (!data || !v || isNaN(v)) continue;

    }

  }
  function importarArquivo() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.csv,.ofx,.txt,text/csv';

      const f = i.files[0]; if (!f) return; const r = new FileReader();

  }
  function revisaImport(itens, nome) {
    const jaTem = it => S.lanc.some(l => (it.ext && l.ext === it.ext) ||
      (l.data === it.data && Math.abs(l.valor - it.valor) < 0.005 && l.tipo === it.tipo && (chaveDesc(l.desc) === chaveDesc(it.desc) || l.fonte === 'comprovante' || it.fonte === 'comprovante')));
    const L = itens.sort((a, b) => a.data.localeCompare(b.data)).map((it, n) => {
      const dup = jaTem(it), ign = IGNORAR.test(semAcento(it.desc));
      return Object.assign(it, { n, dup, marc: !dup && !ign, nota: dup ? 'já lançado' : ign ? 'parece movimentação entre contas ou investimento' : '', cat: sugere(it.desc, it.tipo) });
    });
    const linhaHtml = x => `<div class="irow ${x.marc ? '' : 'off'}" data-n="${x.n}">
      <div class="l1"><input type="checkbox" data-c="marc" ${x.marc ? 'checked' : ''}><span>${dmy(x.data)}</span>${x.nota ? `<span class="tag">${esc(x.nota)}</span>` : ''}<b class="${x.tipo === 'r' ? 'pos' : 'neg'}">${x.tipo === 'r' ? '+' : '−'}${brl(x.valor)}</b></div>
      <input type="text" data-c="desc" value="${esc(x.desc)}" aria-label="Descrição">
      <div class="l3"><select data-c="tipo"><option value="d" ${x.tipo === 'd' ? 'selected' : ''}>Despesa</option><option value="r" ${x.tipo === 'r' ? 'selected' : ''}>Receita</option></select>
        <select data-c="cat">${opts(S.cats[x.tipo], x.cat)}</select></div></div>`;
    const rodape = () => {
      const m = L.filter(x => x.marc), r = m.filter(x => x.tipo === 'r').reduce((s, x) => s + x.valor, 0), d = m.filter(x => x.tipo === 'd').reduce((s, x) => s + x.valor, 0);
      return `<span class="note">${m.length} de ${L.length} selecionados · receitas <b class="pos">${brl(r)}</b> · despesas <b class="neg">${brl(d)}</b></span>`;
    };
    abre(`<h3>Revisar extrato</h3><p class="note">${esc(nome)} · confira, corrija o que precisar e desmarque o que não deve entrar (movimentações entre suas contas, aplicações, pagamento de fatura). Corrigir uma categoria ensina o app para as próximas vezes.</p>
      <div class="row"><button class="btn" id="mTodos">Marcar todos</button><button class="btn" id="dTodos">Desmarcar todos</button></div>
      <div id="lista">${L.map(linhaHtml).join('')}</div>
      <div class="rod"><span id="rodTxt" style="flex:1">${rodape()}</span><button class="btn" id="ix">Cancelar</button><button class="btn pri" id="iok">Importar</button></div>`, true);
    const atualiza = () => { $('rodTxt').innerHTML = rodape(); };
    const linha = el => { const row = el.closest('.irow'); return row ? { row, x: L[+row.dataset.n] } : null; };
    dlg.onchange = e => {
      const c = e.target.dataset.c, ln = linha(e.target); if (!c || !ln) return; const { row, x } = ln;
      if (c === 'marc') { x.marc = e.target.checked; row.classList.toggle('off', !x.marc); }
      else if (c === 'desc') { x.desc = e.target.value; }
      else if (c === 'cat') { x.cat = e.target.value; x.edit = true; }
      else if (c === 'tipo') {
        x.tipo = e.target.value; x.cat = sugere(x.desc, x.tipo); x.edit = false;
        row.querySelector('[data-c=cat]').innerHTML = opts(S.cats[x.tipo], x.cat);
        const b = row.querySelector('b'); b.className = x.tipo === 'r' ? 'pos' : 'neg'; b.textContent = (x.tipo === 'r' ? '+' : '−') + brl(x.valor);

    $('dTodos').onclick = () => { L.forEach(x => x.marc = false); dlg.querySelectorAll('.irow').forEach(r => { r.classList.add('off'); r.querySelector('[data-c=marc]').checked = false; }); atualiza(); };

    $('iok').onclick = () => {
      const sel = L.filter(x => x.marc); if (!sel.length) return alert('Nenhum lançamento selecionado.');
      sel.forEach(x => {

        const k = chaveDesc(x.desc); if (k && x.cat !== 'Outros') S.regras[k] = x.cat;

  // ---------- comprovantes (Pix, TED, boleto): texto colado ou imagem lida no aparelho ----------
  const MESES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
  function lerComprovante(txt) {
    const linhas = String(txt || '').replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean);
    const n = semAcento(linhas.join('\n'));
    const mv = n.match(/valor[^\d\n]{0,25}r\$\s*([\d.]+,\d{2})/) || n.match(/r\$\s*([\d.]+,\d{2})/) || n.match(/valor[^\d\n]{0,25}([\d.]+,\d{2})/);
    const valor = mv ? parseValor(mv[1]) : NaN; if (!(valor > 0)) return null;
    let data = null, m = n.match(/(\d{1,2})\s*(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?\s*(?:de\s*)?(\d{4})/);
    if (m) data = `${m[3]}-${pad(MESES[m[2]])}-${pad(+m[1])}`;
    if (!data) { m = n.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) data = `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`; }
    const recebido = /pix recebido|voce recebeu|recebeu um pix|transferencia recebida|pagamento recebido/.test(n);
    const enviado = /pix enviado|voce enviou|transferencia enviada|pagamento realizado|pagamento efetuado|voce pagou|pix pago/.test(n);
    const tipo = recebido && !enviado ? 'r' : 'd';
    const forma = /\bpix\b/.test(n) ? 'Pix' : /\bted\b/.test(n) ? 'TED' : /\bdoc\b/.test(n) ? 'DOC' : /boleto/.test(n) ? 'Boleto' : 'Transferência';
    const rotulo = tipo === 'r' ? /^(origem|de|pagador|quem enviou|remetente|enviado por)\b/ : /^(destino|para|favorecido|recebedor|quem recebeu|destinatario|beneficiario)\b/;
    const ehRotulo = s => /^(nome|cpf|cnpj|cpf\/cnpj|instituicao|banco|agencia|conta|chave|tipo|valor|data|id|codigo|autenticacao|documento)\b/.test(semAcento(s));
    let nome = '', banco = '';
    const ir = linhas.findIndex(s => rotulo.test(semAcento(s)));
    if (ir >= 0) {
      const resto = linhas[ir].replace(/^[^:]*:\s*/, '');
      if (resto && resto !== linhas[ir] && !ehRotulo(resto)) nome = resto;
      for (let i = ir + 1; i < Math.min(linhas.length, ir + 7); i++) {
        const sa = semAcento(linhas[i]);
        if (!nome && /^nome\b/.test(sa)) nome = linhas[i].replace(/^nome\s*[:]?\s*/i, '');
        else if (!nome && !ehRotulo(linhas[i]) && /[a-z]{3}/.test(sa)) nome = linhas[i];

    data = data || hoje();
    return { data, valor, tipo, desc, ext: `cmp:${data}|${valor.toFixed(2)}|${chaveDesc(nome)}`, fonte: 'comprovante' };
  }
  let tessCarregado = null;
  function carregaOCR() {

  async function ocrImagem(arq, aoProgresso) {

  function abreComprovante() {
    abre(`<h3>Adicionar comprovante</h3>
      <p class="note">Pix, TED ou boleto pago. O app lê no próprio aparelho, mostra o que entendeu e você confere antes de salvar.</p>
      <div class="card" style="margin:0 0 10px"><b>1. Foto ou print do comprovante</b>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="cmpImg">📷 Escolher imagens</button></div>
        <div class="note" id="cmpSt"></div></div>
      <div class="card" style="margin:0 0 10px"><b>2. Ou cole o texto do comprovante</b>

        <textarea id="cmpTx" rows="6" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg)" placeholder="Cole aqui o texto do comprovante"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="cmpLer">Ler texto</button></div></div>

    const st = $('cmpSt');

    $('cmpLer').onclick = () => {

    };
    $('cmpImg').onclick = () => {
      const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
      i.onchange = async () => {

        for (let k = 0; k < fs.length; k++) {

          catch (e) { st.textContent = 'Falha ao ler a imagem ' + (k + 1) + '.'; }

  // ---------- eventos ----------
  document.addEventListener('click', e => {

      case 'addAtivo': formAtivo(); break;

      case 'btnPadrao': S.pref.tema = 'binance'; S.pref.acc = ''; salva(); desenha(); break;
      case 'impExt': importarArquivo(); break;
      case 'addCmp': abreComprovante(); break;

      case 'salvaOrc': {
        const o = {};
        document.querySelectorAll('.lim').forEach(i => { const v = parseValor(i.value); if (v > 0) o[i.dataset.cat] = Math.round(v * 100) / 100; });
        S.orc = o; salva(); alert('Limites salvos.'); desenha(); break;
      }
      case 'salvaCats': {
        const lim = v => v.split(',').map(s => s.trim()).filter(Boolean);
        const dd = lim($('catD').value), rr = lim($('catR').value);
        if (dd.length && rr.length) { S.cats.d = dd; S.cats.r = rr; salva(); alert('Categorias salvas.'); }

      }
      case 'exp': baixa(`meu-financeiro-backup-${hoje()}.json`, S); break;
      case 'imp': lerArquivo(o => { if (!o || !Array.isArray(o.lanc) || !Array.isArray(o.contas)) return alert('Não parece um backup deste app.'); if (!confirm('Substituir os dados deste aparelho pelos do backup?')) return; S = Object.assign(vazio(), o); salva(); desenha(); }); break;
      case 'zera': if (confirm('Apagar todos os lançamentos, contas e ajustes deste aparelho? Exporte um backup antes se quiser guardar.')) { S = vazio(); salva(); desenha(); } break;
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'selTema') { S.pref.tema = e.target.value; salva(); desenha(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'corAcc') { S.pref.acc = e.target.value; salva(); aplicaVisual(); }
  });
  $('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tela = b.dataset.v; desenha(); window.scrollTo(0, 0); } });

  if (/[?&]oculto=1/.test(location.search)) S.pref.oculta = true;
  desenha();

})();
